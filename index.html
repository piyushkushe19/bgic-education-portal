<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BGIC Institute — Coaching & Tuition, Mahavir Enclave, New Delhi</title>
<meta name="description" content="BGIC Institute, Mahavir Enclave, New Delhi: coaching and tuition up to Class 12 (CBSE & NIOS), computer courses, IGNOU BCA/MCA, spoken English and law coaching.">
<meta name="theme-color" content="#0A1224">
<meta property="og:title" content="BGIC Institute — Mahavir Enclave, New Delhi">
<meta property="og:description" content="Students improve through tutoring. Coaching up to Class 12, NIOS, computer courses, IGNOU and more.">
<meta property="og:image" content="img/slider/2.jpg">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
:root {
  --navy: #101c36;
  --mid: #0a1224;
  --blue: #315fea;
  --ivory: #f8f6f0;
  --slate: #68748a;
  --amber: #e9b45b;
  --ink: #16203a;
  --line: rgba(16, 28, 54, 0.14);
  --serif: "Fraunces", Georgia, serif;
  --sans: "Manrope", system-ui, sans-serif;
  --pad: clamp(1rem, 4.5vw, 4rem);
  --xl: clamp(2.4rem, 8.5vw, 8.5rem);
  --hh: 72px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  overflow-x: clip;
}

body {
  margin: 0;
  font: 400 1rem / 1.7 var(--sans);
  color: var(--ink);
  background: var(--ivory);
  overflow-x: clip;
  -webkit-tap-highlight-color: transparent;
}

body.lock {
  overflow: hidden;
  touch-action: none;
}

img {
  max-width: 100%;
  display: block;
}

a {
  color: inherit;
}

h1,
h2,
h3 {
  font-family: var(--serif);
  font-weight: 400;
  line-height: 1.02;
  margin: 0 0 0.5em;
  letter-spacing: -0.02em;
  overflow-wrap: break-word;
}

h1 {
  font-size: var(--xl);
}

h2 {
  font-size: clamp(2rem, 6.5vw, 6rem);
}

h3 {
  font-size: clamp(1.25rem, 2.4vw, 2rem);
  line-height: 1.12;
}

em {
  font-style: italic;
  color: var(--amber);
}

p {
  margin: 0 0 1em;
}

ul {
  padding-left: 1.2rem;
}

:focus-visible {
  outline: 3px solid var(--amber);
  outline-offset: 3px;
}

.wrap {
  max-width: 1360px;
  margin: 0 auto;
  padding: 0 var(--pad);
}

.sec {
  padding: clamp(2.2rem, 6.5vw, 5.5rem) 0;
}

.dark {
  background: var(--mid);
  color: #e8ecf6;
}

.navy {
  background: var(--navy);
  color: #e8ecf6;
}

.blue {
  background: var(--blue);
  color: #fff;
}

.eyebrow {
  font: 600 0.72rem / 1 var(--sans);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--blue);
  display: block;
  margin-bottom: 1rem;
}

.dark .eyebrow,
.navy .eyebrow {
  color: var(--amber);
}

.blue .eyebrow {
  color: var(--ivory);
}

.muted {
  color: var(--slate);
}

.dark .muted,
.navy .muted {
  color: #a9b3c9;
}

.small {
  font-size: 0.85rem;
}

.skip {
  position: absolute;
  left: -999px;
  background: #fff;
  padding: 0.7rem 1rem;
  z-index: 999;
}

.skip:focus {
  left: 8px;
  top: 8px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  min-height: 52px;
  min-width: 44px;
  padding: 0.8rem 1.6rem;
  border: 1.5px solid transparent;
  font: 600 0.82rem var(--sans);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.3s, color 0.3s, border-color 0.3s;
  text-align: center;
  touch-action: manipulation;
}

.btn-p {
  background: var(--amber);
  color: var(--mid);
}

.btn-p:hover {
  background: #fff;
}

.btn-g {
  border-color: rgba(255, 255, 255, 0.45);
  color: #fff;
  background: none;
}

.btn-g:hover {
  background: #fff;
  color: var(--mid);
}

.btn-o {
  border-color: var(--ink);
  color: var(--ink);
  background: none;
}

.btn-o:hover {
  background: var(--ink);
  color: #fff;
}

.btn-b {
  background: var(--blue);
  color: #fff;
}

.btn-b:hover {
  background: var(--navy);
}

.ln {
  display: block;
  overflow: hidden;
  padding-bottom: 0.08em;
}

.ln > span {
  display: block;
}

/* PRELOADER */
#pl {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--mid);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  animation: plfb 0.01s linear 9s forwards;
  padding: var(--pad);
}

@keyframes plfb {
  to {
    visibility: hidden;
    opacity: 0;
  }
}

#pl canvas {
  width: min(200px, 42vw);
  height: min(200px, 42vw);
  margin: 0 auto -0.5rem;
}

.plw {
  font: 400 clamp(2.4rem, 11vw, 6rem) / 1 var(--serif);
  letter-spacing: 0.04em;
}

.plw b {
  font-weight: 400;
  font-style: italic;
  color: var(--amber);
}

.pls {
  font: 600 0.68rem var(--sans);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #a9b3c9;
  margin: 0.8rem 0 1.8rem;
}

.plb {
  width: min(300px, 70vw);
  height: 2px;
  background: rgba(255, 255, 255, 0.18);
  margin: 0 auto 0.8rem;
  position: relative;
  overflow: hidden;
}

.plb i {
  position: absolute;
  inset: 0;
  background: var(--amber);
  transform: scaleX(0);
  transform-origin: left;
}

.pln {
  font: 400 1rem var(--serif);
  color: var(--amber);
}

/* HEADER */
.hdr {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 50;
  padding-top: env(safe-area-inset-top);
  transition: background 0.3s;
}

.hdr.solid {
  background: rgba(10, 18, 36, 0.96);
  backdrop-filter: blur(10px);
}

.hdr .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: var(--hh);
  color: #fff;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  text-decoration: none;
  font: 600 1.05rem var(--serif);
  white-space: nowrap;
}

.brand img {
  height: 36px;
  width: auto;
  background: #fff;
  padding: 3px;
}

.brand small {
  display: block;
  font: 500 0.58rem var(--sans);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.7;
}

.nav {
  display: flex;
  align-items: center;
  gap: 0.1rem;
}

.nav .l {
  color: #fff;
  text-decoration: none;
  font: 500 0.76rem var(--sans);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.6rem 0.7rem;
  background: none;
  border: 0;
  cursor: pointer;
  position: relative;
  white-space: nowrap;
}

.nav .l::after {
  content: "";
  position: absolute;
  left: 0.7rem;
  right: 0.7rem;
  bottom: 0.25rem;
  height: 1px;
  background: var(--amber);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s;
}

.nav .l:hover::after,
.nav .l.on::after,
.dd:hover > .l::after,
.dd:focus-within > .l::after {
  transform: scaleX(1);
}

.dd {
  position: relative;
}

.menu {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 300px;
  max-height: 75vh;
  overflow-y: auto;
  background: var(--mid);
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 0.5rem;
  display: none;
}

.dd:hover .menu,
.dd:focus-within .menu,
.dd.open .menu {
  display: block;
}

.menu a {
  display: block;
  padding: 0.55rem 0.8rem;
  color: #dfe6f6;
  text-decoration: none;
  font-size: 0.88rem;
}

.menu a:hover {
  background: rgba(255, 255, 255, 0.08);
}

.menu h5 {
  margin: 0.6rem 0.8rem 0.2rem;
  font: 600 0.65rem var(--sans);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--amber);
}

.burger {
  display: none;
  background: none;
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #fff;
  width: 46px;
  height: 46px;
  cursor: pointer;
  font-size: 1.1rem;
  touch-action: manipulation;
}

.mob {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--mid);
  color: #fff;
  padding: calc(env(safe-area-inset-top) + 1rem) var(--pad)
    calc(env(safe-area-inset-bottom) + 1.5rem);
  transform: translateX(100%);
  visibility: hidden;
  transition: transform 0.35s, visibility 0.35s;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.mob.open {
  transform: none;
  visibility: visible;
}

.mob .top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}

.mob .l {
  display: block;
  padding: 0.9rem 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  text-decoration: none;
  font: 400 1.4rem var(--serif);
  cursor: pointer;
  list-style: none;
  color: #fff;
}

.mob summary::-webkit-details-marker {
  display: none;
}

.mob summary::after {
  content: "+";
  float: right;
  color: var(--amber);
}

.mob details[open] summary::after {
  content: "–";
}

.mob a.s {
  display: block;
  padding: 0.55rem 0 0.55rem 1rem;
  color: #b9c4dc;
  text-decoration: none;
  font-size: 0.95rem;
}

.mob .btn {
  margin-top: 1.5rem;
  width: 100%;
}

@media (max-width: 1180px) {
  .nav {
    display: none;
  }

  .burger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
}

@media (max-width: 560px) {
  :root {
    --hh: 64px;
  }

  .brand span {
    font-size: 0.95rem;
  }

  .brand img {
    height: 32px;
  }
}

/* HERO */
.hero {
  background: var(--mid);
  background-image: linear-gradient(
    90deg,
    rgba(255, 255, 255, 0.04) 1px,
    transparent 1px
  );
  background-size: 25% 100%;
  color: #fff;
  min-height: min(100svh, 980px);
  min-height: min(100dvh, 980px);
  display: grid;
  align-items: center;
  padding: calc(var(--hh) + 2.5rem) 0 3.5rem;
}

.hero .wrap {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: clamp(2rem, 6vw, 6rem);
  align-items: center;
  width: 100%;
}

.hero h1 {
  font-size: clamp(2.4rem, 7.5vw, 7.4rem);
  margin-bottom: 0.35em;
}

.hero .lead {
  max-width: 44ch;
  color: #b9c4dc;
  font-size: clamp(0.95rem, 1.4vw, 1.2rem);
}

.hero .cta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8rem;
  margin-top: 1.8rem;
}

.hf {
  position: relative;
  margin-right: 18px;
  margin-bottom: 18px;
}

.hf::before {
  content: "";
  position: absolute;
  inset: 18px -18px -18px 18px;
  border: 1px solid var(--amber);
}

.hf .ph {
  position: relative;
  aspect-ratio: 4 / 5;
  background: linear-gradient(160deg, #1c2f63, var(--navy));
  overflow: hidden;
}

.hf img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hp {
  position: absolute;
  left: -3.2rem;
  bottom: 2.5rem;
  background: var(--ivory);
  color: var(--ink);
  padding: 1.2rem 1.5rem;
  max-width: 230px;
  z-index: 2;
  box-shadow: 0 24px 40px -20px #000;
}

.hp b {
  display: block;
  font: 400 2rem / 1 var(--serif);
  margin-bottom: 0.4rem;
}

.hp span {
  font-size: 0.8rem;
  color: var(--slate);
  line-height: 1.4;
  display: block;
}

@media (max-width: 860px) {
  .hero {
    padding: calc(var(--hh) + 1.5rem) 0 2.8rem;
    align-items: start;
    min-height: auto;
  }

  .hero .wrap {
    grid-template-columns: 1fr;
    gap: 2rem;
  }

  .hero .btn {
    flex: 1 1 100%;
  }

  .hf .ph {
    aspect-ratio: 4 / 3;
  }

  .hp {
    left: 0.8rem;
    bottom: -1.4rem;
    max-width: min(200px, 55vw);
    padding: 1rem 1.2rem;
  }

  .hf {
    margin-right: 14px;
    margin-bottom: 2.2rem;
  }
}

@media (max-width: 380px) {
  .hero h1 {
    font-size: clamp(2.1rem, 11vw, 2.8rem);
  }

  .hp {
    max-width: min(170px, 58vw);
    padding: 0.85rem 1rem;
  }

  .hp b {
    font-size: 1.45rem;
  }

  .hp span {
    font-size: 0.72rem;
  }
}

/* ABOUT */
.about .wrap {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: clamp(1rem, 3vw, 3rem);
  align-items: start;
}

.about .im {
  grid-column: 1 / 7;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: linear-gradient(160deg, var(--navy), var(--blue));
}

.about .im img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.about .tx {
  grid-column: 7 / 13;
  padding-top: clamp(0rem, 6vw, 5rem);
}

.about h2 {
  margin-left: -18%;
  position: relative;
  z-index: 2;
  color: var(--navy);
}

.about .tx p {
  max-width: 46ch;
}

.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.4rem;
  border-top: 1px solid var(--line);
  padding-top: 1.1rem;
  margin-top: 1.4rem;
  font-size: 0.85rem;
  color: var(--slate);
}

@media (max-width: 860px) {
  .about .im {
    grid-column: 1 / -1;
    aspect-ratio: 4 / 3;
  }

  .about .tx {
    grid-column: 1 / -1;
    padding-top: 0;
  }

  .about h2 {
    margin-left: 0;
  }
}

/* IMAGE REVEAL */
.big {
  position: relative;
  height: clamp(340px, 72svh, 820px);
  height: clamp(340px, 72dvh, 820px);
  overflow: hidden;
  background: var(--mid);
}

.big .fr {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.big img {
  width: 100%;
  height: 120%;
  object-fit: cover;
  position: absolute;
  top: -10%;
}

.big::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, rgba(10, 18, 36, 0.85), transparent 55%);
}

.big .cap {
  position: absolute;
  z-index: 2;
  left: var(--pad);
  right: var(--pad);
  bottom: clamp(1.35rem, 4vw, 3.4rem);
  color: #fff;
  max-width: min(900px, calc(100% - var(--pad) * 2));
}

.big .cap h2 {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.06em;
  font-size: clamp(1.85rem, 5vw, 5.2rem);
  line-height: 1.02;
  margin: 0;
  max-width: 100%;
}

/* PINNED STORY */
.story {
  position: relative;
  background: var(--navy);
  color: #e8ecf6;
  padding: clamp(2.5rem, 6vw, 4.5rem) 0;
}

.story-bg {
  position: absolute;
  inset: 0;
  background: var(--navy);
  z-index: 0;
  pointer-events: none;
}

.slist,
.stage {
  position: relative;
  z-index: 1;
}

.stage {
  display: none;
}

.slist .it {
  display: grid;
  gap: 1rem;
  padding: 1.6rem 0;
  border-top: 1px solid rgba(255, 255, 255, 0.14);
}

.slist .it .pi {
  aspect-ratio: 16 / 10;
  overflow: hidden;
  background: var(--blue);
}

.slist img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.slist b {
  color: var(--amber);
  font: 600 0.75rem var(--sans);
  letter-spacing: 0.16em;
}

.gs-on .story {
  padding: 0;
}

.gs-on .slist {
  display: none;
}

.gs-on .stage {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  height: 100svh;
  height: 100dvh;
  gap: clamp(1.5rem, 5vw, 5rem);
  align-items: center;
  padding: calc(var(--hh) + 1.2rem) var(--pad) 2rem;
  max-width: 1360px;
  margin: 0 auto;
}

.stage .txt {
  display: grid;
}

.stage .tl {
  grid-area: 1 / 1;
  align-self: center;
}

.stage .tl h2 {
  font-size: clamp(2rem, 5vw, 4.6rem);
}

.stage .tl p {
  max-width: 42ch;
  color: #b9c4dc;
}

.stage .pics {
  display: grid;
  height: min(70svh, 640px);
  height: min(70dvh, 640px);
}

.stage .ti {
  grid-area: 1 / 1;
  height: 100%;
  overflow: hidden;
  background: var(--blue);
}

.gs-on .stage .tl + .tl,
.gs-on .stage .ti + .ti {
  opacity: 0;
}

.stage .ti img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.prog {
  height: 2px;
  background: rgba(255, 255, 255, 0.18);
  margin-top: 1.5rem;
  max-width: 320px;
}

.prog i {
  display: block;
  height: 100%;
  background: var(--amber);
  transform: scaleX(0);
  transform-origin: left;
}

.cnt {
  font: 400 1rem var(--serif);
  color: var(--amber);
  margin-bottom: 1rem;
  display: block;
}

@media (max-width: 899px) {
  .gs-on .stage {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    gap: 1rem;
    align-items: start;
    padding-bottom: 1.2rem;
  }

  .stage .pics {
    order: -1;
    height: 32svh;
    height: 32dvh;
    max-height: 280px;
  }

  .stage .tl {
    align-self: start;
  }

  .stage .tl h2 {
    font-size: clamp(1.7rem, 7.5vw, 2.6rem);
    margin-bottom: 0.3em;
  }

  .stage .tl p {
    font-size: 0.95rem;
    margin-bottom: 0;
  }

  .prog {
    margin-top: 1rem;
  }
}

/* COURSE GALLERY */
.hs {
  background: var(--mid);
  color: #fff;
  padding: clamp(2.5rem, 6vw, 4.5rem) 0 2rem;
  overflow: hidden;
}

.hs .hd {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}

.hs h2 {
  margin: 0;
}

.ht {
  display: flex;
  gap: 1.2rem;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: 0 var(--pad) 1.2rem;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  scrollbar-width: thin;
}

.hpn {
  flex: 0 0 min(80vw, 380px);
  scroll-snap-align: start;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  color: #fff;
}

.hpn .pi {
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: linear-gradient(160deg, var(--navy), var(--c, var(--blue)));
  position: relative;
}

.hpn img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.8s;
}

.hpn:hover img {
  transform: scale(1.07);
}

.hpn .t {
  position: absolute;
  left: 0;
  top: 1rem;
  background: var(--c, var(--amber));
  color: var(--mid);
  font: 600 0.66rem var(--sans);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0.35rem 0.8rem;
}

.hpn .n {
  font: italic 400 0.95rem var(--serif);
  color: var(--amber);

    document.body.classList.remove('lock')
  }

  /* ===== SCROLL ANIMATION — same effects phone → desktop ===== */
  function animate(p) {
    if (!window.gsap || !window.ScrollTrigger || reduce) return
    try {
      gsap.registerPlugin(ScrollTrigger)
      ScrollTrigger.config({ ignoreMobileResize: true })
      if (p === 'home') document.documentElement.classList.add('gs-on')
      mm = gsap.matchMedia()
      mm.add({ isM: '(max-width: 899px)', isD: '(min-width: 900px)' }, function (ctx) {
        var M = ctx.conditions.isM
        $$('[data-clip]').forEach(function (el) {
          var im = $('img', el)
          gsap.fromTo(
            el,
            { clipPath: 'inset(0 100% 0 0)' },
            {
              clipPath: 'inset(0 0% 0 0)',
              duration: 1.3,
              ease: 'power3.inOut',
              scrollTrigger: { trigger: el, start: 'top 88%' },
            },
          )
          if (im)
            gsap.from(im, {
              scale: 1.3,
              duration: 1.8,
              ease: 'power3.out',
              scrollTrigger: { trigger: el, start: 'top 88%' },
            })
        })
        $$('[data-up]').forEach(function (el) {
          gsap.from(el, {
            y: M ? 36 : 50,
            opacity: 0,
            duration: 0.9,
            ease: 'power2.out',
            scrollTrigger: { trigger: el, start: 'top 90%' },
          })
        })
        $$('[data-alt]').forEach(function (el, i) {
          gsap.from(el, {
            x: (i % 2 ? 70 : -70) * (M ? 0.45 : 1),
            opacity: 0,
            duration: 1,
            ease: 'power3.out',
            scrollTrigger: { trigger: el, start: 'top 90%' },
          })
        })
        $$('[data-ttl]').forEach(function (el) {
          gsap.from(el, {
            y: M ? 40 : 60,
            opacity: 0,
            duration: 1,
            ease: 'power3.out',
            scrollTrigger: { trigger: el, start: 'top 92%' },
          })
        })
        gsap.from('.ftr .fg>div', {
          y: 40,
          opacity: 0,
          stagger: 0.1,
          duration: 0.8,
          scrollTrigger: { trigger: '.ftr', start: 'top 94%' },
        })
        if (p === 'gallery') {
          gsap.set('.gal .gt', { opacity: 0, y: 50 })
          ScrollTrigger.batch('.gal .gt', {
            start: 'top 94%',
            once: true,
            onEnter: function (b) {
              gsap.to(b, {
                opacity: 1,
                y: 0,
                stagger: 0.07,
                duration: 0.7,
                ease: 'power2.out',
              })
            },
          })
        }
        if (p !== 'home') return

        var tl = gsap.timeline({
          scrollTrigger: { trigger: '#about', start: 'top 72%' },
          defaults: { ease: 'power3.out' },
        })
        tl.fromTo(
          '#about .im',
          { clipPath: 'inset(0 100% 0 0)' },
          { clipPath: 'inset(0 0% 0 0)', duration: 1.3, ease: 'power3.inOut' },
          0,
        )
          .from('#about .im img', { scale: 1.35, duration: 1.8 }, 0)
          .from('#about .eyebrow', { opacity: 0, x: -20, duration: 0.6 }, 0.3)
          .from('#about h2 .ln>span', { yPercent: 110, duration: 1, stagger: 0.12 }, 0.4)
          .from(
            '#about [data-a]:not(.eyebrow)',
            { y: 30, opacity: 0, duration: 0.8, stagger: 0.12 },
            0.9,
          )

        gsap.fromTo(
          '#big .fr',
          { clipPath: 'inset(8% 6% 8% 6%)' },
          {
            clipPath: 'inset(0% 0% 0% 0%)',
            ease: 'none',
            scrollTrigger: {
              trigger: '#big',
              start: 'top 92%',
              end: 'top 60%',
              scrub: true,
            },
          },
        )
        gsap.fromTo(
          '#big img',
          { yPercent: -4, scale: 1.08 },
          {
            yPercent: 4,
            scale: 1,
            ease: 'none',
            scrollTrigger: {
              trigger: '#big',
              start: 'top bottom',
              end: 'bottom top',
              scrub: true,
            },
          },
        )
        gsap.from('#big .cap', {
          opacity: 0,
          duration: 0.6,
          scrollTrigger: { trigger: '#big', start: 'top 75%' },
        })

        var tls = $$('#stage .tl'),
          tis = $$('#stage .ti'),
          n = tls.length,
          cols = ['#101C36', '#14295e', '#0e3a4a', '#2a1f4d'],
          fade = 0.28,
          step = 1,
          total = (n - 1) * step
        gsap.set(tls.slice(1), { autoAlpha: 0 })
        gsap.set(tis.slice(1), { autoAlpha: 0 })
        var T = gsap.timeline({
          scrollTrigger: {
            trigger: '#story',
            start: 'top top',
            end: '+=' + n * (M ? 50 : 62) + '%',
            pin: true,
            scrub: 0.45,
            anticipatePin: 1,
            invalidateOnRefresh: true,
          },
          defaults: { ease: 'power1.inOut' },
        })
        T.to('#story .prog i', { scaleX: 1, ease: 'none', duration: total }, 0)
        for (var i = 1; i < n; i++) {
          var at = (i - 1) * step + (step - fade)
          T.to(tls[i - 1], { autoAlpha: 0, duration: fade }, at)
            .fromTo(tls[i], { autoAlpha: 0 }, { autoAlpha: 1, duration: fade }, at)
            .fromTo(tis[i], { autoAlpha: 0 }, { autoAlpha: 1, duration: fade }, at)
            .to(tis[i - 1], { autoAlpha: 0, duration: fade }, at)
            .to('.story-bg', { backgroundColor: cols[i % cols.length], duration: fade }, at)
        }

        var tr = $('.ht'),
          dist = function () {
            return Math.max(0, tr.scrollWidth - window.innerWidth + (M ? 24 : 40))
          }
        gsap.set('#hs .prog i', { scaleX: 0 })
        gsap.to(tr, {
          x: function () {
            return -dist()
          },
          ease: 'none',
          scrollTrigger: {
            trigger: '#hs',
            start: 'top top',
            end: function () {
              return '+=' + dist()
            },
            pin: true,
            scrub: 0.8,
            anticipatePin: 1,
            invalidateOnRefresh: true,
            onUpdate: function (s) {
              gsap.set('#hs .prog i', { scaleX: s.progress })
            },
          },
        })

        var items = $$('#sync .sy'),
          pics = $$('#sync .sticky img')
        if (pics[0]) pics[0].classList.add('on')
        gsap.set('#sync .prog i', { scaleX: 1 / items.length })
        items.forEach(function (it, i) {
          ScrollTrigger.create({
            trigger: it,
            start: M ? 'top 62%' : 'top 55%',
            end: M ? 'bottom 62%' : 'bottom 55%',
            onToggle: function (s) {
              if (s.isActive) {
                pics.forEach(function (x, j) {
                  x.classList.toggle('on', j === i)
                })
                gsap.to('#sync .prog i', {
                  scaleX: (i + 1) / items.length,
                  duration: 0.5,
                })
              }
            },
          })
          gsap.from($$('.eyebrow,b,h3,p,a', it), {
            y: 40,
            opacity: 0,
            stagger: 0.08,
            duration: 0.8,
            scrollTrigger: { trigger: it, start: 'top 80%' },
          })
        })

        var r1 = $('#gr1'),
          r2 = $('#gr2'),
          gd = function (r) {
            return Math.max(0, r.scrollWidth - window.innerWidth + 40)
          }
        gsap.fromTo(
          r1,
          { x: 0 },
          {
            x: function () {
              return -gd(r1)
            },
            ease: 'none',
            scrollTrigger: {
              trigger: '#gal',
              start: 'top bottom',
              end: 'bottom top',
              scrub: 0.8,
              invalidateOnRefresh: true,
            },
          },
        )
        gsap.fromTo(
          r2,
          {
            x: function () {
              return -gd(r2)
            },
          },
          {
            x: 0,
            ease: 'none',
            scrollTrigger: {
              trigger: '#gal',
              start: 'top bottom',
              end: 'bottom top',
              scrub: 0.8,
              invalidateOnRefresh: true,
            },
          },
        )

        gsap.fromTo(
          '#adm',
          { clipPath: 'inset(8% 5% 0% 5%)' },
          {
            clipPath: 'inset(0% 0% 0% 0%)',
            ease: 'none',
            scrollTrigger: {
              trigger: '#adm',
              start: 'top 100%',
              end: 'top 35%',
              scrub: true,
            },
          },
        )
        gsap.from('#adm .row>*', {
          y: 40,
          opacity: 0,
          stagger: 0.15,
          duration: 0.9,
          scrollTrigger: { trigger: '#adm .row', start: 'top 90%' },
        })
      })

      $$('#app img').forEach(function (i) {
        if (!i.complete)
          i.addEventListener(
            'load',
            function () {
              clearTimeout(rt)
              rt = setTimeout(function () {
                ScrollTrigger.refresh()
              }, 200)
            },
            { once: true },
          )
      })
      clearTimeout(rt)
      rt = setTimeout(function () {
        ScrollTrigger.refresh()
      }, 350)
    } catch (e) {
      teardown()
      console.warn('Animations disabled:', e)
    }
  }

  /* ===== FORM ===== */
  function setupForm() {
    var f = $('#enq')
    if (!f) return
    f.addEventListener('submit', function (ev) {
      ev.preventDefault()
      var ok = true
      var v = {
        n: $('#n').value.trim(),
        p: $('#p').value.trim(),
        m: $('#m').value.trim(),
        c: $('#c').value,
        g: $('#g').value.trim(),
      }
      function set(id, msg) {
        var i = $('#' + id),
          e = $('#e-' + id)
        e.textContent = msg
        if (i.type !== 'checkbox') i.setAttribute('aria-invalid', msg ? 'true' : 'false')
        if (msg) ok = false
      }
      set('n', v.n.length < 2 ? 'Please enter a name.' : '')
      set(
        'p',
        /^(\+?91[\s-]?)?[0-9][0-9\s-]{8,13}$/.test(v.p)
          ? ''
          : 'Enter a valid phone number (10 digits).',
      )
      set(
        'm',
        v.m && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.m)
          ? 'Enter a valid email address.'
          : '',
      )
      set('c', v.c ? '' : 'Please choose a programme.')
      set('k', $('#k').checked ? '' : 'Consent is required.')
      if (!ok) {
        var b = $('[aria-invalid=true]', f)
        if (b) b.focus()
        return
      }
      var cn = COURSES[v.c].title,
        body =
          'Name: ' +
          v.n +
          '\nPhone: ' +
          v.p +
          (v.m ? '\nEmail: ' + v.m : '') +
          '\nProgramme: ' +
          cn +
          (v.g ? '\n\nMessage:\n' + v.g : '')
      var s = $('#fs')
      s.className = 'status'
      s.textContent =
        'Your email app should open with the enquiry ready to send. Nothing has been sent yet — if it doesn’t open, please call ' +
        C.phones[0].t +
        '.'
      window.location.href =
        'mailto:' +
        C.emails[0] +
        '?subject=' +
        encodeURIComponent('Enquiry: ' + cn) +
        '&body=' +
        encodeURIComponent(body)
    })
  }

  /* ===== BOOT ===== */
  var booted = false
  function boot() {
    if (booted) return
    booted = true
    $('#hdr-root').innerHTML = headerHTML()
    $('#ftr-root').innerHTML = footerHTML()
    $('#burger').addEventListener('click', function () {
      $('#mob').classList.add('open')
      document.body.classList.add('lock')
      this.setAttribute('aria-expanded', 'true')
      $('#mclose').focus()
    })
    $('#mclose').addEventListener('click', function () {
      closeMenu()
      $('#burger').focus()
    })
    $('#mob').addEventListener('click', function (e) {
      if (e.target.closest('a')) closeMenu()
    })
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        closeMenu()
        lbClose()
      }
      if ($('#lb').classList.contains('open')) {
        if (e.key === 'ArrowRight') lbShow(lbi + 1)
        if (e.key === 'ArrowLeft') lbShow(lbi - 1)
      }
    })
    $$('.dd>button').forEach(function (b) {
      b.addEventListener('click', function () {
        var o = b.parentNode.classList.toggle('open')
        b.setAttribute('aria-expanded', String(o))
      })
    })
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.dd'))
        $$('.dd').forEach(function (d) {
          d.classList.remove('open')
        })
      var t = e.target.closest('[data-lb]')
      if (t) lbOpen(+t.dataset.lb)
    })
    $('#lb .x').addEventListener('click', lbClose)
    $('#lb .pv').addEventListener('click', function () {
      lbShow(lbi - 1)
    })
    $('#lb .nx').addEventListener('click', function () {
      lbShow(lbi + 1)
    })
    $('#lb').addEventListener('click', function (e) {
      if (e.target === this) lbClose()
    })
    $('#totop').addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' })
    })
    window.addEventListener('scroll', hdrState, { passive: true })
    window.addEventListener('hashchange', route)
    window.addEventListener(
      'orientationchange',
      function () {
        setTimeout(function () {
          if (window.ScrollTrigger) ScrollTrigger.refresh()
        }, 400)
      },
      { passive: true },
    )
    route()
  }

  /* ===== PRELOADER ===== */
  var ready = false,
    plDone = false
  function startPreloader() {
    var pl = $('#pl'),
      bar = $('.plb i'),
      num = $('.pln'),
      t0 = performance.now(),
      shown = 0,
      scene = null,
      raf = 0
    document.body.classList.add('lock')
    try {
      if (window.THREE && !reduce) {
        var T = THREE,
          cv = $('#plc'),
          r = new T.WebGLRenderer({ canvas: cv, alpha: true, antialias: true })
        r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
        r.setSize(200, 200, false)
        var s = new T.Scene(),
          cam = new T.PerspectiveCamera(40, 1, 0.1, 50)
        cam.position.z = 7
        var g = new T.Group()
        s.add(g)
        g.add(
          new T.Mesh(
            new T.IcosahedronGeometry(1.5, 1),
            new T.MeshBasicMaterial({ color: 0xe9b45b, wireframe: true }),
          ),
          new T.Mesh(
            new T.OctahedronGeometry(0.7),
            new T.MeshBasicMaterial({ color: 0x6f8cf0, wireframe: true }),
          ),
        )
        ;[2.2, 2.8].forEach(function (rr, i) {
          var m = new T.Mesh(
            new T.TorusGeometry(rr, 0.012, 6, 90),
            new T.MeshBasicMaterial({ color: 0x8aa4ff }),
          )
          m.rotation.x = 1.2 + i * 0.5
          m.rotation.y = i * 0.7
          g.add(m)
        })
        scene = {
          draw: function (t, p) {
            g.rotation.y = t * 0.7
            g.rotation.x = t * 0.3
            g.scale.setScalar(0.55 + p * 0.45)
            r.render(s, cam)
          },
          kill: function () {
            s.traverse(function (o) {
              if (o.geometry) o.geometry.dispose()
              if (o.material) o.material.dispose()
            })
            r.dispose()
          },
        }
      }
    } catch (e) {
      scene = null
    }
    function finish() {
      if (plDone) return
      plDone = true
      cancelAnimationFrame(raf)
      document.body.classList.remove('lock')
      var out = function () {
        if (scene) scene.kill()
        pl.remove()
        if (window.ScrollTrigger) ScrollTrigger.refresh()
      }
      pl.style.animation = 'none'
      if (window.gsap && !reduce) {
        gsap
          .timeline({ onComplete: out })
          .to('#pl .plw,#pl .pls,#pl .plb,#pl .pln,#pl canvas', {
            y: -30,
            opacity: 0,
            duration: 0.45,
            stagger: 0.05,
            ease: 'power2.in',
          })
          .to(
            pl,
            { clipPath: 'inset(0 0 100% 0)', duration: 0.9, ease: 'power4.inOut' },
            '-=.1',
          )
      } else {
        pl.style.transition = 'opacity .4s'
        pl.style.opacity = 0
        setTimeout(out, 420)
      }
    }
    function tick(now) {
      var el = now - t0,
        min = reduce ? 200 : 1900,
        target = ready ? 100 : Math.min(88, (el / 2600) * 88)
      shown += (target - shown) * 0.07
      if (ready && el > min && shown > 99.3) shown = 100
      bar.style.transform = 'scaleX(' + shown / 100 + ')'
      num.textContent = Math.round(shown) + '%'
      if (scene) scene.draw(el / 1000, shown / 100)
      if (shown >= 100) {
        setTimeout(finish, 220)
        return
      }
      if (el > 7000) ready = true
      raf = requestAnimationFrame(tick)
    }
    raf = requestAnimationFrame(tick)
  }

  function begin() {
    startPreloader()
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', begin)
  else begin()

  function siteReady() {
    boot()
    ready = true
  }
  if (document.readyState === 'complete') siteReady()
  else window.addEventListener('load', siteReady)
  setTimeout(siteReady, 5000)
})()
</script>
